; ESP8266 WiFi Monitor — PlatformIO project
; Specification: docs/SPEC.md

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino

; 4 MB flash: ~1 MB sketch (leaves room for OTA in Phase 5), 2 MB LittleFS
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs

upload_port = COM8
upload_speed = 460800
monitor_port = COM8
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8

build_flags =
    -Wall

extra_scripts = pre:tools/build_info.py
