; ESP WiFi Monitor - PlatformIO project
; Specification: docs/SPEC.md
;
;   pio run -e nodemcuv2 -t upload     ESP8266 NodeMCU (COM8)
;   pio run -e esp32c3 -t upload       ESP32-C3 with BLE (COM9)

[platformio]
default_envs = nodemcuv2, esp32c3

[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
build_flags =
    -Wall
extra_scripts = pre:tools/build_info.py

[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
; 4 MB flash: ~1 MB sketch (+ same for OTA), 2 MB LittleFS
board_build.ldscript = eagle.flash.4m2m.ld
upload_port = COM8
upload_speed = 460800
monitor_port = COM8
monitor_filters = esp8266_exception_decoder, time

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
; C3 mini boards with embedded flash: DIO is the safe flash mode
board_build.flash_mode = dio
; two app slots (OTA) + LittleFS, see partitions_esp32c3.csv
board_build.partitions = partitions_esp32c3.csv
upload_port = COM9
monitor_port = COM9
monitor_filters = esp32_exception_decoder, time
; the board talks over the chip's own USB (USB-Serial/JTAG), not a UART bridge
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0
